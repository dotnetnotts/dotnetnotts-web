# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and to Azure Web App - dotnetnotts
permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Version Blazor boot URLs
      shell: pwsh
      env:
        DEPLOYMENT_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        $path = Join-Path $env:GITHUB_WORKSPACE 'wwwroot\index.html'
        $html = Get-Content -LiteralPath $path -Raw
        if (-not $html.Contains('__DEPLOYMENT_VERSION__')) {
          throw 'Missing deployment version placeholder in index.html'
        }
        $html.Replace('__DEPLOYMENT_VERSION__', $env:DEPLOYMENT_VERSION) |
          Set-Content -LiteralPath $path -NoNewline -Encoding utf8

    - name: Set up dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'
      
    - name: Restore dependencies
      run: dotnet restore

    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: Run tests
      run: dotnet test

    - name: dotnet publish
      run: dotnet publish dotnetnotts.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'dotnetnotts'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_ed404e5fa39a41b8a539f3eb78f9a2bc }}
        package: "${{env.DOTNET_ROOT}}/myapp" 